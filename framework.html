<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Todo List</h1>
        <p>Manage your tasks with this TodoList.</p>
      </header>

      <section aria-labelledby="todo-entry-heading">
        <h2 id="todo-entry-heading">Add a new task</h2>
        <form>
          <label for="new-task">Task</label>
          <input type="text" id="new-task" name="new-task" placeholder="Enter a task" />
          <button type="submit">Add Task</button>
        </form>
      </section>

      <section aria-labelledby="task-list-heading">
        <h2 id="task-list-heading">Tasks</h2>
        <ul aria-live="polite" id="task-list">
          <li>
            <span>ExExExExEx</span>
            <button type="button">Complete</button>
            <button type="button">Delete</button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
