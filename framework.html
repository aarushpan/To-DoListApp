<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Todo List</h1>
        <p>Manage your tasks with this TodoList.</p>
      </header>

      <section aria-labelledby="todoheading">
        <h2 id="todoheading">Add a New Task</h2>
        <form name="newtask">
         
          <input name="newtask" type="text" id="newtask" placeholder="Enter a task" />
          <button type="submit">Add Task</button>
        </form>
      </section>

      <section aria-labelledby="task-list-heading">
        <h2 id="task-list-heading">Tasks</h2>
        <ul aria-live="polite" id="task-list">
          <li>
            <span>ExExExExEx</span>
            <button type="button">Complete</button>
            <button type="button">Delete</button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
